spring.application.name=streamhub
server.port=${PORT:8080}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/streamhub?options=-c%20TimeZone=Asia/Kolkata}
spring.datasource.username=${DATABASE_USER:denny}
spring.datasource.password=${DATABASE_PASSWORD:password}
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.username=${REDIS_USERNAME:}
spring.data.redis.ssl.enabled=${REDIS_SSL_ENABLED:false}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=streamhub
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.dennymathew.streamhub.events
streamhub.kafka.movie-watched-topic=${KAFKA_MOVIE_WATCHED_TOPIC:movie-watched}
streamhub.catalog.url=${CATALOG_URL:http://localhost:8081}
streamhub.cors.origin=${CORS_ORIGIN:http://localhost:5173}
streamhub.jwt.secret=${JWT_SECRET}
streamhub.admin.key=${ADMIN_API_KEY:}
streamhub.catalog.key=${CATALOG_API_KEY:}
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.delivery.timeout.ms=15000
spring.kafka.producer.properties.request.timeout.ms=5000
spring.kafka.producer.properties.max.block.ms=10000
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=record
spring.jpa.open-in-view=false

# Local Docker uses PLAINTEXT. Hosted Kafka sets SASL_SSL plus provider-issued credentials.
spring.kafka.security.protocol=${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
spring.kafka.properties.sasl.mechanism=${KAFKA_SASL_MECHANISM:PLAIN}
spring.kafka.properties.sasl.jaas.config=${KAFKA_SASL_JAAS_CONFIG:}
spring.kafka.admin.auto-create=${KAFKA_AUTO_CREATE_TOPICS:true}
streamhub.kafka.topic-partitions=${KAFKA_TOPIC_PARTITIONS:3}
streamhub.kafka.topic-replicas=${KAFKA_TOPIC_REPLICAS:1}
# -1 replicas delegates replication choice to the managed broker.
streamhub.catalog.connect-timeout-ms=${CATALOG_CONNECT_TIMEOUT_MS:1000}
streamhub.catalog.read-timeout-ms=${CATALOG_READ_TIMEOUT_MS:3000}

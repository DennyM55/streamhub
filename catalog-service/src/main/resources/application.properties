spring.application.name=catalog-service
server.port=${PORT:8081}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/streamhub}
spring.datasource.username=${DATABASE_USER:denny}
spring.datasource.password=${DATABASE_PASSWORD:password}

spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.username=${REDIS_USERNAME:}
spring.data.redis.ssl.enabled=${REDIS_SSL_ENABLED:false}
spring.data.redis.connect-timeout=${REDIS_CONNECT_TIMEOUT:2s}
spring.data.redis.timeout=${REDIS_READ_TIMEOUT:2s}

# Both services must use the same private key. An unset key disables catalogue writes.
streamhub.catalog.key=${CATALOG_API_KEY:}
streamhub.seed-demo=${STREAMHUB_SEED_DEMO:false}

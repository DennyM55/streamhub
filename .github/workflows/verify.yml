name: Verify StreamHub
on:
  push:
    branches: [master, codex/streamhub-live-demo]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  java-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        directory: ['.', 'catalog-service']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: bash mvnw -B verify
        working-directory: ${{ matrix.directory }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: java-reports-${{ strategy.job-index }}
          path: '**/target/surefire-reports'
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --run
      - run: npm run build
  full-stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/setup-local.sh
      - run: docker compose up --build -d
      - name: Wait for catalogue through edge API
        run: |
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://localhost:8080/movies?size=1 >/dev/null; then exit 0; fi
            sleep 3
          done
          docker compose logs --tail=100
          exit 1
      - name: Real API smoke tests
        run: |
          set -a
          source .env
          set +a
          python3 scripts/smoke.py
      - name: Verify event reached durable consumer
        run: |
          for attempt in $(seq 1 30); do
            count=$(docker compose exec -T postgres psql -U streamhub -d streamhub_users -Atc 'select count(*) from processed_movie_watched_events' 2>/dev/null || echo 0)
            if [ "${count:-0}" -gt 0 ]; then exit 0; fi
            sleep 2
          done
          exit 1
      - run: docker compose logs --no-color > integration.log
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-stack-log
          path: integration.log
      - run: docker compose down -v
        if: always()

services:
  postgres:
    image: postgres:16
    container_name: streamhub-postgres
    environment:
      POSTGRES_DB: streamhub
      POSTGRES_USER: denny
      POSTGRES_PASSWORD: password
      TZ: Asia/Kolkata
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    container_name: streamhub-redis
    command: redis-server --maxmemory 20mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"

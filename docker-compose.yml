services:
  postgres:
    image: postgres:16
    container_name: streamhub-postgres
    environment:
      POSTGRES_DB: streamhub
      POSTGRES_USER: denny
      POSTGRES_PASSWORD: password
      TZ: Asia/Kolkata
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: streamhub-redis
    command: redis-server --maxmemory 20mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"

  kafka:
    image: apache/kafka:4.0.2
    container_name: streamhub-kafka
    ports:
      - "9092:9092"

volumes:
  postgres-data:
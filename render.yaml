# Deploy catalogue and cache first, then deploy/render-api.yaml.
envVarGroups:
- name: streamhub-service-keys
  envVars:
  - key: CATALOG_API_KEY
    generateValue: true
services:
- type: keyvalue
  name: streamhub-cache
  plan: free
  region: frankfurt
  ipAllowList: []
  maxmemoryPolicy: allkeys-lru
- type: web
  name: streamhub-catalog
  runtime: docker
  plan: free
  region: frankfurt
  dockerfilePath: ./catalog-service/Dockerfile
  dockerContext: ./catalog-service
  healthCheckPath: /health
  envVars:
  - fromGroup: streamhub-service-keys
  - key: PORT
    value: '8081'
  - key: JAVA_TOOL_OPTIONS
    value: -Xms64m -Xmx256m -XX:MaxMetaspaceSize=128m -XX:+UseSerialGC
  - key: DATABASE_URL
    sync: false
  - key: POSTGRES_CA_CERT
    sync: false
  - key: DATABASE_USER
    sync: false
  - key: DATABASE_PASSWORD
    sync: false
  - key: SPRING_DATA_REDIS_URL
    fromService:
      type: keyvalue
      name: streamhub-cache
      property: connectionString
  - key: STREAMHUB_SEED_DEMO
    value: 'true'
  - key: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE
    value: '3'
  buildFilter:
    paths:
    - catalog-service/**

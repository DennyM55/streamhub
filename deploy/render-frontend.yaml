# Free static frontend, deployed after the API URL is available.
services:
- type: web
  runtime: static
  name: streamhub-dennym55
  rootDir: frontend
  buildCommand: npm ci && npm run build
  staticPublishPath: dist
  buildFilter:
    paths:
    - frontend/**
  envVars:
  - key: NODE_VERSION
    value: '24'
  - key: SKIP_INSTALL_DEPS
    value: 'true'
  - key: VITE_API_BASE_URL
    sync: false
  routes:
  - type: rewrite
    source: /*
    destination: /index.html
  headers:
  - path: /*
    name: X-Content-Type-Options
    value: nosniff
  - path: /*
    name: Referrer-Policy
    value: strict-origin-when-cross-origin
  - path: /*
    name: X-Frame-Options
    value: DENY
